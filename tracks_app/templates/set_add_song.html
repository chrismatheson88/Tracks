<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add Song to {{ setlist.name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="container">
      <aside class="sidebar">
        <h1>{{ setlist.name }}</h1>
        <p class="subtitle">Choose a song to add</p>

        <div class="landing-actions" style="justify-content: flex-start; margin-bottom: 20px;">
          <a class="landing-button secondary" href="/">Home</a>
          <a class="landing-button secondary" href="{{ url_for('set_detail_route', setlist_id=setlist.id) }}">Back to set</a>
        </div>
      </aside>

      <main class="library">
        <h2>Library songs</h2>

        {% if songs %}
          <div class="setlist-order">
            {% for song in songs %}
              <form method="post" action="{{ url_for('add_song_to_setlist_route') }}">
                <input type="hidden" name="song_id" value="{{ song.id }}" />
                <input type="hidden" name="setlist_id" value="{{ setlist.id }}" />
                <button type="submit" class="song-title-button" style="width: 100%; text-align: left;">{{ song.title }}</button>
              </form>
            {% endfor %}
          </div>
        {% else %}
          <p class="empty">No songs in the library yet.</p>
        {% endif %}
      </main>
    </div>
  </body>
</html>
